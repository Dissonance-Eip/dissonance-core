name: Release Core Addon

on:
    push:
        branches: [dev]
        tags: ["v[0-9]*"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    addon-checks:
        name: Addon Checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              shell: bash
              run: |
                  if [ -f package-lock.json ]; then
                    npm ci
                  else
                    npm install
                  fi

            - name: Validate required npm scripts
              run: |
                  node -e "const scripts = (require('./package.json').scripts || {}); const missing = ['build', 'test'].filter((name) => !scripts[name]); if (missing.length) { console.error('Missing required npm script(s): ' + missing.join(', ')); process.exit(1); }"

            - name: Build addon check
              run: npm run build

            - name: Smoke test addon load
              run: |
                  node -e "const addon=require('./build/Release/dissonance_core.node'); const required=['process']; const missing=required.filter((k)=>typeof addon[k]!=='function'); if(missing.length){console.error('Missing exports: ' + missing.join(', ')); process.exit(1);} console.log('Addon exports OK:', required.join(', '));"

            - name: Run addon JS tests
              run: npm test

    build-addon:
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        needs: addon-checks
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Pinned to windows-2022 (VS 2022 / v17). windows-latest
                    # migrated to windows-2025 (VS 18), which node-gyp 10.x
                    # can't detect — its PowerShell VS probe both fails to
                    # recognize the version and overflows its stdio buffer.
                    - os: windows
                      runner: windows-2022
                      arch: x64
                    - os: linux
                      runner: ubuntu-latest
                      arch: x64
                    - os: macos
                      runner: macos-latest
                      arch: arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  architecture: ${{ matrix.arch }}
                  cache: npm

            - name: Install dependencies
              shell: bash
              run: |
                  if [ -f package-lock.json ]; then
                    npm ci
                  else
                    npm install
                  fi

            - name: Build addon
              run: npm run build

            - name: Prepare platform artifact
              run: node scripts/prepare-artifact.js

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: addon-${{ matrix.os }}-${{ matrix.arch }}
                  path: dist/*.node

    release:
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        needs: build-addon

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: Prepare release metadata
              id: meta
              run: |
                  sha=$(git rev-parse --short HEAD)
                  if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                    echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=dev-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
                  fi
                  echo "name=Dev build $sha" >> "$GITHUB_OUTPUT"

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.meta.outputs.tag }}
                  name: ${{ steps.meta.outputs.name }}
                  generate_release_notes: true
                  files: dist/**/*.node

            - name: Dispatch UI sync workflow
              env:
                  UI_REPO_TOKEN: ${{ secrets.UI_REPO_TOKEN }}
              run: |
                  if [ -z "$UI_REPO_TOKEN" ]; then
                    echo "UI_REPO_TOKEN is not set; skipping UI dispatch."
                    exit 0
                  fi

                  curl -sS -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $UI_REPO_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    https://api.github.com/repos/Dissonance-Eip/ui/dispatches \
                    -d '{"event_type":"core-release"}'
