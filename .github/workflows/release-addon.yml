name: Release Core Addon

on:
  push:
    branches: [dev, '57-github-action-for-automatic-workflow-with-ui']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-addon:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
            arch: x64
          - os: linux
            runner: ubuntu-latest
            arch: x64
          - os: linux
            runner: ubuntu-24.04-arm64
            arch: arm64
          - os: macos
            runner: macos-13
            arch: x64
          - os: macos
            runner: macos-14
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build addon
        run: npm run build

      - name: Prepare platform artifact
        run: node scripts/prepare-artifact.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.node

  release:
    runs-on: ubuntu-latest
    needs: build-addon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release metadata
        id: meta
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "tag=dev-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "name=Dev build $sha" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          files: dist/**/*.node
